name: KissClaw Governance Check

on:
  pull_request:
    paths:
      - "KISSCLAW.md"
      - "KISSCLAW_UPSTREAM.json"
      - "BACKPORT_POLICY.md"
      - "RELEASE_WORKFLOW.md"
      - ".github/CODEOWNERS"
      - ".github/workflows/kissclaw-*.yml"

permissions:
  contents: read

jobs:
  governance-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify governance files present
        run: |
          set -euo pipefail
          required_files=(
            "KISSCLAW.md"
            "KISSCLAW_UPSTREAM.json"
            "BACKPORT_POLICY.md"
            "RELEASE_WORKFLOW.md"
            ".github/CODEOWNERS"
            ".github/workflows/kissclaw-release.yml"
          )
          missing=()
          for f in "${required_files[@]}"; do
            if [ ! -f "$f" ]; then
              missing+=("$f")
            fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "ERROR: Missing governance files: ${missing[*]}"
            exit 1
          fi
          echo "All governance files present."

      - name: Validate upstream metadata
        run: |
          set -euo pipefail
          node -e '
            const meta = require("./KISSCLAW_UPSTREAM.json");
            const required = ["remote", "packageVersion", "tag", "commit", "releaseDate"];
            const missing = required.filter(k => !meta[k]);
            if (missing.length > 0) {
              console.error("Missing required fields in KISSCLAW_UPSTREAM.json:", missing.join(", "));
              process.exit(1);
            }
            console.log("KISSCLAW_UPSTREAM.json valid:", JSON.stringify(meta, null, 2));
          '
